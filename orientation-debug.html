<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>方向鎖定診斷工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 1rem;
        }

        /* CSS Fallback - 簡化版 */
        @media screen and (max-width: 1023px) and (orientation: landscape) {
            html {
                overflow: hidden;
            }
            
            body {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                margin: 0;
                padding: 0;
            }
            
            #root {
                width: 100vh;
                height: 100vw;
                overflow-y: auto;
                overflow-x: hidden;
                transform-origin: top left;
                transform: rotate(-90deg) translateX(-100%);
                position: absolute;
                top: 0;
                left: 0;
                padding: 1rem;
            }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .section h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #ffd700;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
        }

        .value {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 0.6rem;
            border-radius: 0.3rem;
        }

        .status {
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.3);
            border: 2px solid #10b981;
        }

        .status.warning {
            background: rgba(245, 158, 11, 0.3);
            border: 2px solid #f59e0b;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.3);
            border: 2px solid #ef4444;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .test-box {
            aspect-ratio: 1;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2rem;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn:active {
            opacity: 0.7;
        }

        #log {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0.5rem;
            padding: 1rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="container">
            <h1>🔍 方向鎖定診斷工具</h1>

            <!-- 狀態顯示 -->
            <div id="mainStatus" class="status">檢測中...</div>

            <!-- API 支援檢測 -->
            <div class="section">
                <h2>📱 API 支援狀態</h2>
                <div class="info-row">
                    <span class="label">Screen Orientation API</span>
                    <span class="value" id="orientationAPI">--</span>
                </div>
                <div class="info-row">
                    <span class="label">Lock 方法</span>
                    <span class="value" id="lockMethod">--</span>
                </div>
                <div class="info-row">
                    <span class="label">目前鎖定狀態</span>
                    <span class="value" id="lockStatus">--</span>
                </div>
                <button class="btn" onclick="tryLock()">🔒 嘗試 API 鎖定</button>
            </div>

            <!-- 設備資訊 -->
            <div class="section">
                <h2>📊 設備資訊</h2>
                <div class="info-row">
                    <span class="label">User Agent</span>
                    <span class="value" id="ua" style="font-size: 0.7rem;">--</span>
                </div>
                <div class="info-row">
                    <span class="label">視窗尺寸</span>
                    <span class="value" id="windowSize">--</span>
                </div>
                <div class="info-row">
                    <span class="label">螢幕尺寸</span>
                    <span class="value" id="screenSize">--</span>
                </div>
                <div class="info-row">
                    <span class="label">目前方向</span>
                    <span class="value" id="currentOrientation">--</span>
                </div>
                <div class="info-row">
                    <span class="label">CSS 偵測</span>
                    <span class="value" id="cssOrientation">--</span>
                </div>
            </div>

            <!-- 視覺測試 -->
            <div class="section">
                <h2>🎨 視覺測試</h2>
                <p style="margin-bottom: 1rem; font-size: 0.9rem; opacity: 0.9;">
                    如果看到下方 9 個顏色方塊，代表內容沒有跑出畫面
                </p>
                <div class="test-grid">
                    <div class="test-box" style="background: #ef4444;">1</div>
                    <div class="test-box" style="background: #f59e0b;">2</div>
                    <div class="test-box" style="background: #10b981;">3</div>
                    <div class="test-box" style="background: #3b82f6;">4</div>
                    <div class="test-box" style="background: #8b5cf6;">5</div>
                    <div class="test-box" style="background: #ec4899;">6</div>
                    <div class="test-box" style="background: #06b6d4;">7</div>
                    <div class="test-box" style="background: #84cc16;">8</div>
                    <div class="test-box" style="background: #f97316;">9</div>
                </div>
            </div>

            <!-- 操作日誌 -->
            <div class="section">
                <h2>📝 操作日誌</h2>
                <div id="log">載入中...</div>
                <button class="btn" onclick="clearLog()">清除日誌</button>
            </div>

            <button class="btn" onclick="location.href='/'">返回主 App</button>
        </div>
    </div>

    <script>
        let logs = [];

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logs.push(`[${timestamp}] ${message}`);
            document.getElementById('log').textContent = logs.join('\n');
            document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
        }

        function clearLog() {
            logs = [];
            document.getElementById('log').textContent = '日誌已清除';
        }

        function updateInfo() {
            // API 支援檢測
            const hasOrientationAPI = 'orientation' in screen;
            const hasLockMethod = screen.orientation && typeof screen.orientation.lock === 'function';
            
            document.getElementById('orientationAPI').textContent = hasOrientationAPI ? '✅ 支援' : '❌ 不支援';
            document.getElementById('lockMethod').textContent = hasLockMethod ? '✅ 支援' : '❌ 不支援';

            // 設備資訊
            document.getElementById('ua').textContent = navigator.userAgent.substring(0, 50) + '...';
            document.getElementById('windowSize').textContent = `${window.innerWidth} x ${window.innerHeight}`;
            document.getElementById('screenSize').textContent = `${screen.width} x ${screen.height}`;

            // 方向資訊
            const isLandscape = window.matchMedia('(orientation: landscape)').matches;
            const orientationText = isLandscape ? '🔄 橫向 (Landscape)' : '📱 直向 (Portrait)';
            document.getElementById('currentOrientation').textContent = orientationText;
            
            const cssMatch = window.matchMedia('(max-width: 1023px) and (orientation: landscape)').matches;
            document.getElementById('cssOrientation').textContent = cssMatch ? '✅ CSS 已啟用' : '⭕ CSS 未啟用';

            // 主狀態
            const mainStatus = document.getElementById('mainStatus');
            const isMobile = window.innerWidth < 1024;
            
            if (!isMobile) {
                mainStatus.textContent = '🖥️ 桌面模式 - 方向鎖定不適用';
                mainStatus.className = 'status warning';
            } else if (isLandscape) {
                if (cssMatch) {
                    mainStatus.textContent = '✅ 橫向模式 - CSS Fallback 已啟用';
                    mainStatus.className = 'status success';
                } else {
                    mainStatus.textContent = '⚠️ 橫向模式 - CSS 未生效（可能出現全白）';
                    mainStatus.className = 'status error';
                }
            } else {
                mainStatus.textContent = '✅ 直向模式 - 正常顯示';
                mainStatus.className = 'status success';
            }
        }

        async function tryLock() {
            log('開始嘗試 Screen Orientation Lock...');
            
            if (!screen.orientation) {
                log('❌ screen.orientation 不存在');
                document.getElementById('lockStatus').textContent = '❌ API 不存在';
                return;
            }

            if (!screen.orientation.lock) {
                log('❌ screen.orientation.lock 方法不存在');
                document.getElementById('lockStatus').textContent = '❌ Lock 不支援';
                return;
            }

            try {
                log('嘗試鎖定為 portrait...');
                await screen.orientation.lock('portrait');
                log('✅ 成功鎖定為直向模式！');
                document.getElementById('lockStatus').textContent = '✅ 已鎖定';
            } catch (error) {
                log(`❌ 鎖定失敗: ${error.name} - ${error.message}`);
                document.getElementById('lockStatus').textContent = `❌ ${error.name}`;
                
                if (error.name === 'NotSupportedError') {
                    log('提示: 此瀏覽器不支援 Orientation Lock');
                } else if (error.name === 'SecurityError') {
                    log('提示: 需要在全螢幕模式或安裝為 PWA');
                }
            }
        }

        // 初始化
        log('頁面載入完成');
        log(`User Agent: ${navigator.userAgent}`);
        updateInfo();

        // 自動嘗試鎖定
        setTimeout(() => {
            log('自動嘗試 API 鎖定...');
            tryLock();
        }, 1000);

        // 監聽變化
        window.addEventListener('resize', () => {
            log(`視窗尺寸變更: ${window.innerWidth} x ${window.innerHeight}`);
            updateInfo();
        });

        window.addEventListener('orientationchange', () => {
            log('方向變更事件觸發');
            updateInfo();
        });

        if (screen.orientation) {
            screen.orientation.addEventListener('change', () => {
                log(`Screen Orientation 變更: ${screen.orientation.type}`);
                updateInfo();
            });
        }

        setInterval(updateInfo, 2000);
    </script>
</body>
</html>
